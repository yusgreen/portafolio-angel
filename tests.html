<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weBOT · Suite de pruebas</title>
<style>
    :root {
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e7e9ee;
        --muted: #8b93a7;
        --ok: #2ecc71;
        --fail: #ff5252;
        --skip: #ffb300;
        --border: #262b36;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 28px 20px 60px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .hint { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
    code { background: #222734; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    .summary {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-weight: 600;
        margin-bottom: 18px;
    }
    .summary.has-fail { border-color: var(--fail); color: var(--fail); }
    .summary.all-ok { border-color: var(--ok); color: var(--ok); }
    #results { display: flex; flex-direction: column; gap: 8px; max-width: 980px; }
    .row {
        display: grid;
        grid-template-columns: 74px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--muted);
        border-radius: 8px;
    }
    .row.ok { border-left-color: var(--ok); }
    .row.fail { border-left-color: var(--fail); }
    .row.skip { border-left-color: var(--skip); }
    .badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; }
    .row.ok .badge { color: var(--ok); }
    .row.fail .badge { color: var(--fail); }
    .row.skip .badge { color: var(--skip); }
    .name { min-width: 0; overflow-wrap: anywhere; }
    .ms { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .detail { grid-column: 2 / 4; color: var(--fail); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
    .row.skip .detail { color: var(--skip); }
    details { max-width: 980px; margin-top: 24px; color: var(--muted); }
    summary { cursor: pointer; user-select: none; }
    pre {
        margin-top: 10px;
        padding: 14px;
        max-height: 320px;
        overflow: auto;
        background: #0b0d11;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
</style>
</head>
<body>
    <h1>weBOT · Suite de pruebas</h1>
    <p class="hint">
        Corre contra un <code>HBInit</code> simulado (no abre salas reales).
        Necesita <code>webot.js</code> en la misma carpeta.
        Si abrís esto con <code>file://</code> y localStorage falla, serví la carpeta con
        <code>python -m http.server</code> y entrá a <code>http://localhost:8000/tests.html</code>.
    </p>
    <div id="summary" class="summary">Ejecutando pruebas...</div>
    <div id="results"></div>
    <details>
        <summary>Log de consola</summary>
        <pre id="log"></pre>
    </details>
    <script src="tests.js"></script>
</body>
</html>
